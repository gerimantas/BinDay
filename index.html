<!DOCTYPE html>
<html lang="lt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>BinDay — Atliekų išvežimas</title>
<meta name="description" content="Atliekų išvežimo grafikas — Žalgirio g. 8A, Juragiai. Mišrios, pakuotės, stiklas.">
<meta name="theme-color" content="#09090b">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; worker-src 'self'; style-src 'unsafe-inline'; connect-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'self'">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BinDay">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon.ico" sizes="any">
<!-- iOS ignores the manifest icons when adding to the home screen; without this it
     uses a screenshot of the page instead of the app icon. -->
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  :root {
    --bg-base: #09090b;
    --bg-surface: #18181b;
    --bg-active: #27272a;

    --text-primary: #fafafa;
    --text-secondary: #b4b4bb;
    /* Was #52525b, which measured 2.29:1 against the card ground — under half the 4.5:1
       needed to be readable, and effectively invisible outdoors at the kerb, which is
       exactly where this app gets used. #9a9aa2 clears 5.3:1 even on the lightest
       surface here while still reading as secondary. */
    --text-dim: #9a9aa2;
    --border-subtle: #3f3f46;

    /* One neon colour per waste type — the same hue drives the dot, the chip border
       and its glow, so colour alone identifies the bin at a glance.
       Saturated hues on a near-black ground read as neon; the matching -glow value
       is the same colour at low alpha, used for the halo. */
    /* Orange rather than red — brighter on this ground than either red tried before
       (#ff2d55 went muddy, #ff4d6a sat dimmer than the yellow beside it).
       Deliberately at hue 29°, not the more obvious 35°: mixed and packaging appear
       side by side on the same row, and 35° left only 19° between them, which is too
       close to tell apart in sunlight. This keeps a 25° gap at 6.8:1 contrast. */
    --mixed: #ff7a00;      /* bright orange — mišrios komunalinės */
    --mixed-glow: rgba(255, 122, 0, 0.55);
    --packaging: #ffe600;  /* neon yellow — pakuotės */
    --packaging-glow: rgba(255, 230, 0, 0.5);
    --glass: #00ff9d;      /* neon green — stiklas */
    --glass-glow: rgba(0, 255, 157, 0.5);

    /* Types that only appear at some addresses. Kept clearly distinct from the three
       above so a green-waste bin is never mistaken for glass. */
    --green: #7fdc4a;      /* žaliosios atliekos */
    --green-glow: rgba(127, 220, 74, 0.45);
    --paper: #4db8ff;      /* popierius */
    --paper-glow: rgba(77, 184, 255, 0.45);
    --other: #d4d4d8;      /* unclassified */
    --other-glow: rgba(212, 212, 216, 0.35);

    /* Urgency can no longer be signalled by red — red is a bin colour now. The
       "tonight" state is carried by a pulsing white-hot ring instead, which reads
       as urgent regardless of which bins happen to be due. */
    --accent-soon: #ffffff;
    --header-h: 92px;   /* card height plus its 8px top inset and a gap below */
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg-base);
    color: var(--text-secondary);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 17px;
    line-height: 1.35;
    min-height: 100vh;
    padding: calc(var(--header-h) + 16px) 16px 48px;
    -webkit-font-smoothing: antialiased;
  }

  /* A card like the rest, not a bar welded to the top edge. It stays fixed so the
     address is always visible, but sits inset with rounded corners and its own lighter
     ground so it reads as part of the same family as the hero and the list rows. */
  header {
    position: fixed;
    top: 8px; left: 12px; right: 12px;
    z-index: 10;
    background: rgba(39, 39, 42, 0.94);
    backdrop-filter: blur(14px);
    border: 1px solid var(--border-subtle);
    border-radius: 14px;
    padding: 12px 15px;
  }
  header h1 {
    font-size: 12px;
    font-weight: 700;
    color: var(--text-dim);
    letter-spacing: 0.14em;
    text-transform: uppercase;
  }
  /* The address is what the user checks to know whose schedule this is, so it leads —
     the app's own name is the smaller line above it. */
  header .addr {
    font-size: 15px;
    font-weight: 600;
    color: var(--text-primary);
    margin-top: 2px;
    line-height: 1.3;
    padding-right: 46px;   /* clear of the menu button */
  }

  /* ---- Hero: the answer to "do I put the bin out tonight?" ---- */
  /* A lit edge marks this card as the one that answers the question. The first attempt
     used 7%-opacity white, which measured as a glow but was invisible on a screen —
     against a near-black page the halo has to be strong enough to actually lift off it.
     Still calmer than the "tonight" state below, which pulses and goes fully white. */
  .hero {
    background: var(--bg-surface);
    border: 1px solid rgba(255, 255, 255, 0.34);
    border-radius: 16px;
    padding: 22px 20px;
    margin-bottom: 14px;
    text-align: center;
    box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.12),
                0 0 20px rgba(255, 255, 255, 0.30),
                0 0 52px rgba(255, 255, 255, 0.16);
  }
  .hero.tonight {
    border-color: var(--accent-soon);
    animation: pulse 2.4s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 1px rgba(255,255,255,0.55), 0 0 24px rgba(255,255,255,0.10); }
    50%      { box-shadow: 0 0 0 1px rgba(255,255,255,1.00), 0 0 44px rgba(255,255,255,0.26); }
  }
  /* Motion is the urgency cue here, so respect a user who has asked for less of it —
     the border alone still distinguishes the state. */
  @media (prefers-reduced-motion: reduce) {
    .hero.tonight { animation: none; box-shadow: 0 0 0 1px var(--accent-soon); }
  }
  .hero .when {
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--text-dim);
  }
  .hero.tonight .when { color: var(--accent-soon); font-weight: 700; }
  .hero .days {
    font-size: 46px;
    font-weight: 800;
    color: var(--text-primary);
    line-height: 1.05;
    margin: 6px 0 2px;
  }
  .hero .date {
    font-size: 14px;
    color: var(--text-secondary);
  }
  .hero .types {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    margin-top: 18px;
  }

  /* Identical to a list row's mark, so the same bin looks the same everywhere on the
     page — outlined label, no dot.

     All chips share one width and centre their text. Ragged widths (Pakuotės 82px vs
     Stiklas 63px) made a row of them look misaligned, and a column of rows worse. The
     short names take extra letter-spacing so they fill the box rather than floating in
     it — see .chip.short / .mark.short, which the renderer adds. */
  .chip {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 92px;
    border: 1px solid currentColor;
    border-radius: 5px;
    padding: 4px 9px;
    font-size: 15px;
    font-weight: 600;
    line-height: 1.2;
    white-space: nowrap;
    color: var(--text-primary);
  }
  /* Tracking scaled to how far each name falls short of the widest one, so all three
     reach roughly the same optical width instead of one word floating in its box.
     `letter-spacing` adds a trailing space after the last glyph, which pushes the text
     off-centre; the matching negative margin cancels it. */
  .chip.t1, .mark.t1 { letter-spacing: 0.055em; margin-right: -0.055em; }
  .chip.t2, .mark.t2 { letter-spacing: 0.11em;  margin-right: -0.11em;  }

  .chip.MIXED     { color: var(--mixed); }
  .chip.PACKAGING { color: var(--packaging); }
  .chip.GLASS     { color: var(--glass); }
  .chip.GREEN     { color: var(--green); }
  .chip.PAPER     { color: var(--paper); }
  .chip.OTHER     { color: var(--other); }

  .dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  /* The halo is what makes these read as neon rather than as flat colour swatches.
     Every type needs an entry: a missing one leaves the dot transparent while its
     label is coloured, which reads as a rendering fault. */
  .dot.MIXED     { background: var(--mixed);     box-shadow: 0 0 8px var(--mixed-glow); }
  .dot.PACKAGING { background: var(--packaging); box-shadow: 0 0 8px var(--packaging-glow); }
  .dot.GLASS     { background: var(--glass);     box-shadow: 0 0 8px var(--glass-glow); }
  .dot.GREEN     { background: var(--green);     box-shadow: 0 0 8px var(--green-glow); }
  .dot.PAPER     { background: var(--paper);     box-shadow: 0 0 8px var(--paper-glow); }
  .dot.OTHER     { background: var(--other);     box-shadow: 0 0 8px var(--other-glow); }

  /* ---- Upcoming list ---- */
  h2 {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--text-dim);
    margin: 26px 0 10px 4px;
    font-weight: 600;
  }

  /* Date on the left, bins on the right. Two columns now that "po N sav." has moved
     under the date, where it belongs — both are facts about *when*, while the right
     column answers *which bin*. */
  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    background: var(--bg-surface);
    border: 1px solid var(--border-subtle);
    border-radius: 12px;
    padding: 13px 15px;
    margin-bottom: 8px;
  }
  .row .left { min-width: 0; }
  .row .d {
    font-size: 16px;
    font-weight: 700;
    color: var(--text-primary);
  }
  /* Weekday and countdown share this line. No uppercase: it applied to the weekday
     abbreviation but would shout "PO 2 SAV." beside it. */
  .row .wd {
    font-size: 12px;
    color: var(--text-dim);
    letter-spacing: 0.03em;
    margin-top: 2px;
  }
  /* One bin per line, each named. A row of bare dots made the reader map colour to
     meaning from the legend at the foot of the page; naming each one costs a little
     height and removes that step. Rows are no longer uniform in height, which is
     correct — a day with three collections IS bigger news than a day with one. */
  /* The marks are centred as a BLOCK but left-aligned inside it, so every dot sits on
     one vertical line. Centring each mark individually instead makes the dots step in
     and out by half the difference in label width. `width: max-content` sizes the block
     to its longest label; `margin: 0 auto` then centres that block in the row. */
  .row .marks {
    display: flex;
    flex-wrap: wrap;
    justify-content: flex-end;
    align-items: center;
    gap: 6px;
  }
  /* An outlined label rather than a dot plus text: the outline carries the colour, so
     the bin is identifiable at a glance while the row stays one line tall even with
     three collections on the same day. */
  .row .marks .mark {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 92px;
    border: 1px solid currentColor;
    border-radius: 5px;
    padding: 4px 9px;
    font-size: 15px;
    font-weight: 600;
    line-height: 1.2;
    white-space: nowrap;
  }
  /* Full strength, not the dimmed grey the dots sat in before — these are the answer
     to "which bin", so they read at the same weight as the date beside them. */
  .row .marks .mark.MIXED     { color: var(--mixed); }
  .row .marks .mark.PACKAGING { color: var(--packaging); }
  .row .marks .mark.GLASS     { color: var(--glass); }
  .row .marks .mark.GREEN     { color: var(--green); }
  .row .marks .mark.PAPER     { color: var(--paper); }
  .row .marks .mark.OTHER     { color: var(--other); }


  .year-sep {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.14em;
    color: var(--text-dim);
    margin: 18px 0 8px 4px;
  }

  .more {
    width: 100%;
    background: transparent;
    color: var(--text-secondary);
    border: 1px dashed var(--border-subtle);
    border-radius: 12px;
    padding: 12px;
    font-size: 14px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    margin-top: 4px;
  }
  .more:active { background: var(--bg-surface); }


  /* ---- Actions ---- */
  .actions { margin-top: 26px; }
  button {
    width: 100%;
    background: var(--bg-surface);
    color: var(--text-primary);
    border: 1px solid var(--border-subtle);
    border-radius: 12px;
    padding: 15px;
    font-size: 15px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    margin-bottom: 9px;
  }
  button:active { background: var(--bg-active); }
  /* Calendar export state: current reads as done, stale asks to be pressed. */
  #ics.synced { color: var(--text-secondary); font-weight: 500; }
  #ics.synced .tick { color: var(--glass); }
  #ics.stale { border-color: var(--accent-soon); }
  #ics.stale .sub { color: var(--text-secondary); }
  button .sub {
    display: block;
    font-size: 12px;
    font-weight: 400;
    color: var(--text-dim);
    margin-top: 3px;
  }

  footer {
    margin-top: 30px;
    font-size: 12px;
    color: var(--text-dim);
    line-height: 1.6;
    text-align: center;
  }
  footer .warn { color: var(--accent-soon); }
  footer .monitor {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    margin-bottom: 3px;
    color: var(--text-secondary);
  }
  footer .monitor span {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--glass);
    box-shadow: 0 0 7px var(--glass-glow);
  }

  @media (min-width: 560px) {
    body { max-width: 520px; margin: 0 auto; }
  }

  /* Update offer: pinned above the bottom edge until answered. */
  .update {
    position: fixed; left: 16px; right: 16px; z-index: 40;
    bottom: calc(16px + env(safe-area-inset-bottom));
    max-width: 488px; margin: 0 auto;
    display: flex; align-items: center; gap: 12px;
    background: var(--bg-active); border: 1px solid var(--accent-soon);
    border-radius: 12px; padding: 12px 14px;
    font-size: 14px; color: var(--text-primary);
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
  }
  .update[hidden] { display: none; }
  .update span { flex: 1; }
  .update button {
    width: auto; flex: none; margin: 0; padding: 9px 14px;
    background: var(--text-primary); color: var(--bg-base); border: none;
    font-size: 14px; font-weight: 700;
  }
</style>
</head>
<body>

<header>
  <h1>BinDay</h1>
  <div class="addr" id="addr">Žalgirio g. 8A, Juragiai</div>
</header>

<main id="app" aria-live="polite"></main>

<div id="update" class="update" role="status" aria-live="polite" hidden></div>
<script>
/* ===== data.js ===== */
/* ------------------------------------------------------------------
   Schedule data — generated from Atlieku_isvezimo_grafikai.md

   Dates are stored as an explicit list rather than anchor+interval on
   purpose: Švara's schedule does deviate (the window before 2026-08
   contained Monday pickups and an extra Wednesday run on 2026-07-22).
   Computing dates from a fixed interval would silently skip those, and
   a missed pickup is the one failure the user actually notices.

   `until` is the operator's published horizon, not a guess. Past it the
   app says "refresh needed" instead of inventing dates.
------------------------------------------------------------------ */
const ADDRESS = 'Žalgirio g. 8A, Juragių k., Garliavos apylinkių sen. Kauno r. sav.';
/* When the operators were last asked for the schedule. Not read by the app:
   tools/update_zalgirio_schedule.py rewrites this line, so it stays as the
   record of the last data change. */
const DEFAULT_COLLECTED = '2026-10-12';
// Per operator: Ekonovus is checked by the monthly run, Švara by hand in a browser
// (its site blocks automated requests), so the two dates drift apart.
const DEFAULT_CHECKED_EKONOVUS = '2026-10-12';
const DEFAULT_CHECKED_SVARA = '2026-10-12';
function getLastChecked() {
  return { ekonovus: DEFAULT_CHECKED_EKONOVUS, svara: DEFAULT_CHECKED_SVARA };
}

/* The schedule shipped with the app. Treat as immutable. */
const DEFAULT_SCHEDULE = [
  {
    type: 'MIXED', label: 'Mišrios', id: '52-MK-036668',
    // Calendar clients won't honour a colour we set, so the emoji carries the
    // colour coding instead. Chosen to match the app's neon palette.
    emoji: '🔴', color: 'red',
    operator: 'UAB Kauno švara', until: '2028-01-04',
    dates: ['2026-08-04','2026-08-18','2026-09-01','2026-09-15','2026-09-29',
            '2026-10-13','2026-10-27','2026-11-10','2026-11-24','2026-12-08',
            '2026-12-22','2027-01-05','2027-01-19','2027-02-02','2027-02-16',
            '2027-03-02','2027-03-16','2027-03-30','2027-04-13','2027-04-27',
            '2027-05-11','2027-05-25','2027-06-08','2027-06-22','2027-07-06',
            '2027-07-20','2027-08-03','2027-08-17','2027-08-31','2027-09-14',
            '2027-09-28','2027-10-12','2027-10-26','2027-11-09','2027-11-23',
            '2027-12-07','2027-12-21','2028-01-04']
  },
  {
    type: 'PACKAGING', label: 'Pakuotės', id: '52-P-22781',
    emoji: '🟡', color: 'gold',
    operator: 'Ekonovus', until: '2027-06-15',
    dates: ['2026-08-04','2026-08-25','2026-09-15','2026-10-06','2026-10-27',
            '2026-11-17','2026-12-08','2026-12-29','2027-01-19','2027-02-09',
            '2027-03-02','2027-03-23','2027-04-13','2027-05-04','2027-05-25',
            '2027-06-15']
  },
  {
    type: 'GLASS', label: 'Stiklas', id: '52-S-24716',
    emoji: '🟢', color: 'springgreen',
    operator: 'Ekonovus', until: '2027-09-28',
    dates: ['2026-08-04','2026-10-27','2027-01-19','2027-04-13','2027-07-06',
            '2027-09-28']
  }
];

/* Read through getSchedule() rather than the constant so the rest of the app
   never depends on where the schedule comes from. */
function getSchedule() {
  return DEFAULT_SCHEDULE;
}

const WD = ['Sekmadienis','Pirmadienis','Antradienis','Trečiadienis',
            'Ketvirtadienis','Penktadienis','Šeštadienis'];
const WD_SHORT = ['Sekm','Pir','Ant','Tre','Ket','Pen','Šeš'];
const MON_GEN = ['sausio','vasario','kovo','balandžio','gegužės','birželio',
                 'liepos','rugpjūčio','rugsėjo','spalio','lapkričio','gruodžio'];

/* ===== dates.js ===== */
/* Local-date ISO string. Deliberately not toISOString(), which converts to UTC
   and rolls the date back an hour before midnight in Lithuania — the app would
   claim a pickup was "today" on the evening before. */
function isoLocal(d) {
  const p = n => String(n).padStart(2, '0');
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
}

function parseISO(s) {
  const [y, m, d] = s.split('-').map(Number);
  return new Date(y, m - 1, d);
}

function daysBetween(fromISO, toISO) {
  return Math.round((parseISO(toISO) - parseISO(fromISO)) / 864e5);
}

function prettyDate(iso) {
  const d = parseISO(iso);
  return d.getDate() + ' ' + MON_GEN[d.getMonth()];
}

function relativeLabel(days) {
  if (days === 0) return 'šiandien';
  if (days === 1) return 'rytoj';
  if (days < 0) return null;
  if (days < 7) return `po ${days} d.`;
  const weeks = Math.round(days / 7);
  return `po ${weeks} sav.`;
}

/* ===== calendar.js ===== */
/* Merge every container's dates into one day-keyed calendar: one row per day
   listing the bins due, which is how the bins actually get taken out. */
function buildCalendar() {
  const byDay = new Map();
  for (const c of getSchedule()) {
    for (const iso of c.dates) {
      if (!byDay.has(iso)) byDay.set(iso, []);
      byDay.get(iso).push(c);
    }
  }
  return [...byDay.entries()]
    .sort((a, b) => a[0].localeCompare(b[0]))
    .map(([iso, types]) => ({ iso, types }));
}

/* ===== render.js ===== */
/* Whether the user has asked to see the whole horizon. Deliberately not persisted:
   the minute-tick re-render reads it, but a fresh open should start compact. */
let expanded = false;

function render(now) {
  const today = isoLocal(now);
  const calendar = buildCalendar();
  const upcoming = calendar.filter(e => e.iso >= today);
  const app = document.getElementById('app');
  const checked = getLastChecked();
  const monitor = `<div class="monitor"><span aria-hidden="true"></span>Ekonovus · tikrinta ${checked.ekonovus}</div>
       <div class="monitor"><span aria-hidden="true"></span>Kauno švara · tikrinta ${checked.svara}</div>`;

  if (!upcoming.length) {
    app.innerHTML = `
      <div class="hero">
        <div class="when">Grafikas pasibaigė</div>
        <div class="days" style="font-size:30px">Reikia atnaujinti</div>
        <div class="date">Paskutinė data: ${calendar.length ? calendar[calendar.length - 1].iso : '—'}</div>
      </div>
      <footer>${monitor}Perscrapink operatorių svetaines ir pergeneruok grafiką.</footer>`;
    return;
  }

  const next = upcoming[0];
  const days = daysBetween(today, next.iso);
  const nextDate = parseISO(next.iso);

  // "Tonight" is the actionable state: the operator asks for bins out the evening
  // before, so a pickup tomorrow is what needs acting on right now.
  const tonight = days === 1 || (days === 0 && now.getHours() < 8);

  /* The kicker says what to DO, not what the card is. "Kitas išvežimas" only
     restated the obvious — the big number below it already says a pickup is
     coming — so the line that actually matters lives here instead: the
     operators want the bins out the evening before. The two urgent states keep
     their own wording, which is more specific still. */
  let headline, when;
  if (days === 0) { headline = 'Šiandien'; when = 'Išveža'; }
  else if (days === 1) { headline = 'Rytoj'; when = 'Išstumk šįvakar'; }
  else { headline = `Po ${days} d.`; when = 'Konteinerius paruošti iš vakaro'; }

  /* Chips share a fixed width, so a short name would sit in a pool of empty box.
     Tracking is widened in two steps according to how many characters the name is
     short of the longest one in play — computed from the actual labels rather than
     hardcoded, since a new waste type changes which name is longest. */
  const widest = Math.max(...getSchedule().map(c => c.label.length), 1);
  const track = label => {
    const gap = widest - label.length;
    return gap >= 3 ? ' t2' : gap >= 1 ? ' t1' : '';
  };

  const chips = types => types
    .map(c => `<span class="chip ${c.type}${track(c.label)}">${c.label}</span>`)
    .join('');

  // Outlined labels in the bin's own colour. The name carries the meaning, so the dot
  // is redundant beside it — the border supplies the colour cue on its own.
  const dots = types => types
    .map(c => `<span class="mark ${c.type}${track(c.label)}">${c.label}</span>`)
    .join('');

  let html = `
    <div class="hero${tonight ? ' tonight' : ''}">
      <div class="when">${when}</div>
      <div class="days">${headline}</div>
      <div class="date">${WD[nextDate.getDay()]}, ${prettyDate(next.iso)}</div>
      <div class="types">${chips(next.types)}</div>
    </div>`;

  // Show a season's worth by default — enough to plan around without a wall of
  // dates — and keep the rest one tap away rather than dropping it. The full list
  // runs to the operator's horizon, which is where "no more data" genuinely starts.
  const PREVIEW = 8;
  const rest = expanded ? upcoming.slice(1) : upcoming.slice(1, PREVIEW + 1);
  const hidden = upcoming.length - 1 - rest.length;

  if (rest.length) {
    html += '<h2>Toliau</h2>';
    let shownYear = parseISO(today).getFullYear();
    for (const e of rest) {
      const d = parseISO(e.iso);
      // Once the list runs past New Year, "13 sausio" is ambiguous without the year.
      // A divider costs one line and answers it for every row beneath it.
      if (d.getFullYear() !== shownYear) {
        shownYear = d.getFullYear();
        html += `<div class="year-sep">${shownYear}</div>`;
      }
      const rel = relativeLabel(daysBetween(today, e.iso));
      html += `
        <div class="row">
          <div class="left">
            <div class="d">${prettyDate(e.iso)}</div>
            <div class="wd">${WD_SHORT[d.getDay()]}${rel ? ` · ${rel}` : ''}</div>
          </div>
          <div class="marks">${dots(e.types)}</div>
        </div>`;
    }

    if (hidden > 0) {
      html += `<button id="more" class="more">Rodyti visus (dar ${hidden})</button>`;
    } else if (expanded) {
      html += '<button id="less" class="more">Rodyti mažiau</button>';
    }
  }

  // The button says what the calendar holds, not just what it does: "Įkelti"
  // alone left it unclear whether that had already happened, and whether an
  // earlier import still matched the schedule.
  const cal = exportState(upcoming, today);
  const pickups = ltCount(upcoming.length, 'išvežimas', 'išvežimai', 'išvežimų');
  let calTitle, calSub, calClass = '';
  if (cal.kind === 'none') {
    calTitle = 'Įkelti į kalendorių';
    // Imports made before this record existed leave no trace, so do not claim
    // "not imported". Whether a re-import duplicates events is unverified, so
    // the text promises nothing about it.
    calSub = `${pickups}, priminimai 17:00 ir 20:00 iš vakaro · įkėlimo įrašo nėra; `
      + 'jei jau įkėlei anksčiau, įkelk dar kartą';
  } else if (cal.kind === 'current') {
    calClass = 'synced';
    calTitle = '<span class="tick" aria-hidden="true">✓</span> Kalendoriaus failas atsisiųstas';
    // Only the download is known; the app cannot see whether the file was imported.
    calSub = `Atsisiųsta ${cal.at} · grafikas nuo to laiko nepasikeitė. `
      + 'Google kalendoriui failą įkelk kompiuteryje: calendar.google.com → Nustatymai → Importuoti';
  } else {
    calClass = 'stale';
    calTitle = 'Atnaujinti kalendorių';
    const what = [];
    if (cal.changed) what.push(ltCount(cal.changed, 'nauja ar pakeista data', 'naujos ar pakeistos datos', 'naujų ar pakeistų datų'));
    if (cal.cancelled.length) what.push(`atšaukta: ${cal.cancelled.join(', ')} — ištrink kalendoriuje ranka`);
    calSub = `Grafikas pasikeitė po atsisiuntimo ${cal.at}: ${what.join('; ')}`;
  }

  html += `
    <div class="actions">
      <button id="ics" class="${calClass}">
        ${calTitle}
        <span class="sub">${calSub}</span>
      </button>
    </div>`;

  // Surface each container's horizon: they differ (Ekonovus publishes a fixed
  // count, Švara a rolling window), so one running out is normal and shouldn't
  // read as the whole schedule being stale.
  const expiring = getSchedule()
    .filter(c => daysBetween(today, c.until) < 60)
    .map(c => c.label);

  // "Konteinerius paruošti iš vakaro" moved into the hero, where it is the
  // instruction rather than a footnote. The footer keeps only provenance.
  html += `<footer>
    ${monitor}
    ${expiring.length ? `<br><span class="warn">Baigiasi grafikas: ${expiring.join(', ')}</span>` : ''}
  </footer>`;

  app.innerHTML = html;
  document.getElementById('ics').addEventListener('click', () => { downloadICS(upcoming); refresh(); });

  const more = document.getElementById('more');
  if (more) more.addEventListener('click', () => { expanded = true; refresh(); });
  const less = document.getElementById('less');
  if (less) less.addEventListener('click', () => { expanded = false; refresh(); });
}

/* ===== ics.js ===== */
/* ------------------------------------------------------------------
   ICS export

   Every pickup is written as its own VEVENT rather than one RRULE. Švara's
   own feed uses RRULE (every 2nd Tuesday), which cannot express the off-cycle
   runs that do occur — those would silently vanish from the calendar. Explicit
   events cost a few KB and stay correct.

   VALARM fires at -PT7H against an all-day event (00:00), i.e. 17:00 the
   previous day, matching the operator's "put bins out the evening before".
------------------------------------------------------------------ */
function icsEscape(s) {
  return s.replace(/\\/g, '\\\\').replace(/;/g, '\\;')
          .replace(/,/g, '\\,').replace(/\n/g, '\\n');
}

/* RFC 5545 caps lines at 75 *octets*, not characters — Lithuanian ž/ų/ė take two
   bytes each in UTF-8, so counting characters overshoots the limit on exactly the
   lines that contain the address. Google and Apple tolerate over-long lines but
   Outlook truncates them, which would silently drop the location.

   Fold on a byte budget, and never split a multi-byte character in half. */
function fold(line) {
  const enc = new TextEncoder();
  if (enc.encode(line).length <= 75) return line;

  const out = [];
  let cur = '';
  let budget = 75;          // first line: no leading space
  for (const ch of line) {  // iterate code points, not UTF-16 units
    const size = enc.encode(ch).length;
    if (enc.encode(cur).length + size > budget) {
      out.push(cur);
      cur = ch;
      budget = 74;          // continuation lines lose one octet to the space
    } else {
      cur += ch;
    }
  }
  if (cur) out.push(cur);
  return out[0] + out.slice(1).map(s => '\r\n ' + s).join('');
}

function stamp(d) {
  const p = n => String(n).padStart(2, '0');
  return d.getUTCFullYear() + p(d.getUTCMonth() + 1) + p(d.getUTCDate()) +
         'T' + p(d.getUTCHours()) + p(d.getUTCMinutes()) + p(d.getUTCSeconds()) + 'Z';
}

function buildICS(entries) {
  const now = new Date();
  const lines = [
    'BEGIN:VCALENDAR',
    'VERSION:2.0',
    'PRODID:-//BinDay//Waste Schedule//LT',
    'CALSCALE:GREGORIAN',
    'X-WR-CALNAME:Atliekų išvežimas',
    'X-WR-TIMEZONE:Europe/Vilnius'
  ];

  for (const e of entries) {
    const compact = e.iso.replace(/-/g, '');
    const end = isoLocal(new Date(parseISO(e.iso).getTime() + 864e5)).replace(/-/g, '');
    // One ordering throughout the event — rarest bin first — so the marks and the
    // words line up instead of reading in opposite directions.
    const ordered = [...e.types].sort((a, b) => a.dates.length - b.dates.length);
    const names = ordered.map(c => c.label).join(', ');
    const detail = ordered.map(c => `${c.emoji} ${c.label} (${c.id})`).join('\n');

    // Colour coding has to survive into the calendar, and no reliable mechanism
    // exists: RFC 7986 COLOR is ignored by Google, and per-event colours can only
    // be set through each provider's own API. Emoji in the title is the one thing
    // that renders identically everywhere, so the marks lead the summary — one
    // circle per bin, matching the app's red / yellow / green.
    // Rarest bin first: in a truncated calendar cell the leading mark is the one
    // that survives, and that should be the pickup you cannot afford to miss.
    const marks = ordered.map(c => c.emoji).join('');

    lines.push(
      'BEGIN:VEVENT',
      // Stable UID per day: re-importing updates the event instead of duplicating it.
      fold(`UID:binday-${compact}@binday.local`),
      `DTSTAMP:${stamp(now)}`,
      `DTSTART;VALUE=DATE:${compact}`,
      `DTEND;VALUE=DATE:${end}`,
      fold(`SUMMARY:${marks} ${icsEscape(names)}`),
      fold(`DESCRIPTION:${icsEscape(detail)}`),
      fold(`LOCATION:${icsEscape(ADDRESS)}`),
      // Honoured by Apple Calendar and anything else implementing RFC 7986;
      // harmless where it isn't. A day can hold several bins but only one colour,
      // so it goes to the rarest one due — glass never falls on its own here, and
      // missing it costs 84 days, so it should win over the fortnightly mixed bin.
      `COLOR:${ordered[0].color}`,
      'TRANSP:TRANSPARENT',
      // Two reminders the evening before, against an all-day event (00:00), so the
      // offsets count back from midnight: -PT7H is 17:00, -PT4H is 20:00. The first
      // catches you while there's still daylight, the second before bed — a single
      // alert is easy to dismiss and then forget with the bins still inside.
      'BEGIN:VALARM',
      'ACTION:DISPLAY',
      fold(`DESCRIPTION:${icsEscape('Rytoj išveža: ' + names)}`),
      'TRIGGER:-PT7H',
      'END:VALARM',
      'BEGIN:VALARM',
      'ACTION:DISPLAY',
      fold(`DESCRIPTION:${icsEscape('Paskutinis priminimas — rytoj išveža: ' + names)}`),
      'TRIGGER:-PT4H',
      'END:VALARM',
      'END:VEVENT'
    );
  }

  lines.push('END:VCALENDAR');
  return lines.join('\r\n');
}

function downloadICS(entries) {
  const blob = new Blob([buildICS(entries)], { type: 'text/calendar;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'binday.ics';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  markExported(entries);
}

/* What was last downloaded as a calendar file from this phone, so the button can
   say whether that file is current. The app cannot see the calendar itself — it
   only knows what it handed over, so "atsisiųsta" means "the file was downloaded
   here"; whether it was imported is unknown.

   Keyed by the container ids. Each pickup is
   stored as "date|ids", so a bin added to an existing day counts as a change. */
const CAL_STORE = 'binday.calendar';

function calendarKey() {
  return getSchedule().map(c => c.id).sort().join(',');
}

function pickupSig(e) {
  return e.iso + '|' + e.types.map(c => c.id).sort().join(',');
}

function loadExports() {
  try { return JSON.parse(localStorage.getItem(CAL_STORE) || '{}') || {}; }
  catch (e) { return {}; }
}

function markExported(entries) {
  const all = loadExports();
  all[calendarKey()] = { at: isoLocal(new Date()), pickups: entries.map(pickupSig) };
  try { localStorage.setItem(CAL_STORE, JSON.stringify(all)); }
  catch (e) { /* private mode: the button just keeps saying "not yet" */ }
}

/* none: never exported for this address. current: the calendar holds every
   upcoming pickup. stale: pickups were added, changed or cancelled since the
   download — importing the new file should update the first two (UIDs are per date), but a
   cancelled one stays in the calendar until deleted by hand, so those dates are listed. */
function exportState(upcoming, today) {
  const last = loadExports()[calendarKey()];
  if (!last || !Array.isArray(last.pickups)) return { kind: 'none' };
  const had = new Set(last.pickups);
  const days = new Set(upcoming.map(e => e.iso));
  // New or changed days: one event per day, so a fresh file covers both.
  const changed = upcoming.filter(e => !had.has(pickupSig(e))).length;
  // A day gone entirely has no event to overwrite it.
  const cancelled = last.pickups
    .map(s => s.slice(0, 10))
    .filter(iso => iso >= today && !days.has(iso));
  if (!changed && !cancelled.length) return { kind: 'current', at: last.at };
  return { kind: 'stale', at: last.at, changed, cancelled };
}

/* Lithuanian count agreement: 1 / 21 data, 2–9 datos, 10–20 / 30 datų. */
function ltCount(n, one, few, many) {
  const tens = n % 100, ones = n % 10;
  const word = (tens >= 10 && tens <= 20) || ones === 0 ? many : ones === 1 ? one : few;
  return `${n} ${word}`;
}

/* A single `now` per render keeps every relative label consistent — no chance
   of the hero saying "tomorrow" while a row says "today" after a midnight tick. */
function refresh() { render(new Date()); }

/* ===== update.js ===== */
/* ------------------------------------------------------------------
   Telling the user an update is ready.

   The worker is cache-first, so a new build used to land silently: the phone
   kept showing the old page until the app happened to be closed and reopened,
   and nothing said a newer schedule was waiting. Now the new worker installs,
   waits, and the page offers it; accepting reloads onto the new build. Same
   pattern as BakeStack. The offer stays on screen until answered — a toast that
   fades in three seconds is easy to miss on the one open that matters.

   An installed PWA can sit in the background for days without a fresh load, so
   the worker is also asked to look for an update whenever the app comes back
   to the foreground.
------------------------------------------------------------------ */
let updateTimer = null;

function showUpdate(message, action) {
  const el = document.getElementById('update');
  el.innerHTML = '';
  const span = document.createElement('span');
  span.textContent = message;
  el.appendChild(span);
  if (action) {
    const btn = document.createElement('button');
    btn.textContent = action.label;
    btn.addEventListener('click', action.run);
    el.appendChild(btn);
  }
  el.hidden = false;
  clearTimeout(updateTimer);
  // Information fades; an offer that needs an answer does not.
  if (!action) updateTimer = setTimeout(() => { el.hidden = true; }, 4000);
}

function registerServiceWorker() {
  if (!('serviceWorker' in navigator)) return;

  navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(reg => {
    const offer = worker => showUpdate('Yra nauja programėlės versija.', {
      label: 'Atnaujinti',
      run: () => worker.postMessage('SKIP_WAITING'),
    });
    // Downloaded on an earlier visit and still waiting.
    if (reg.waiting && navigator.serviceWorker.controller) offer(reg.waiting);
    reg.addEventListener('updatefound', () => {
      const nw = reg.installing;
      if (!nw) return;
      nw.addEventListener('statechange', () => {
        // No controller means a first install: a cache fill, not an update.
        if (nw.state === 'installed' && navigator.serviceWorker.controller) offer(nw);
      });
    });
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) reg.update().catch(() => {});
    });
  }).catch(() => { /* offline support is optional; the app works without it */ });

  // The new worker took over: reload once so the page runs the build it cached.
  // Not on a first visit, where clients.claim() also fires this.
  const hadController = !!navigator.serviceWorker.controller;
  let reloading = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (reloading || !hadController) return;
    reloading = true;
    location.reload();
  });
}

/* ===== main.js ===== */
/* Startup only: first paint, the minute tick, refresh on return to the app, and the
   service worker. */
refresh();
setInterval(refresh, 60000);

document.addEventListener('visibilitychange', () => {
  if (!document.hidden) refresh();
});

registerServiceWorker();
</script>
</body>
