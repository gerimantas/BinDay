name: Žalgirio 8A schedule check

# Does Žalgirio g. 8A in Juragiai still have current schedules at both operators,
# and does the committed dist/ still hold?
#
# Started life as a throwaway probe answering whether a GitHub runner could
# reach either operator at all. It could: egress 172.208.13.80, and Ekonovus
# answered faster there (0.6 s) than locally (9.4 s). That question is settled,
# so the file now earns its place as a cheap standing check. It intentionally
# probes this one address only; bulk catalogue and schedule refreshes are disabled.

on:
  schedule:
    # Weekly, Monday 05:23 UTC. Off the hour: the top of the hour is when every
    # scheduled workflow on GitHub fires at once.
    - cron: '23 5 * * 1'
  workflow_dispatch:

concurrency:
  group: health-check
  cancel-in-progress: true

# Keep Python output visible if a probe is cancelled.
env:
  PYTHONUNBUFFERED: '1'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: index.html is up to date with src/
        # Catches the failure the build step exists to prevent: editing src/ and
        # shipping a stale index.html, which looks like the fix simply not working.
        run: python3 tools/build_app.py --check

      - name: dist/ passes the publish gate
        # The committed dist/ is what the app fetches. A build that lost an
        # address or fused two of them looks entirely reasonable from every
        # other angle — this is the check that says otherwise.
        run: python3 tools/check_dist.py

      - name: Runner identity
        run: |
          echo "egress IP: $(curl -s --max-time 20 https://api.ipify.org || echo UNKNOWN)"
          echo "region hint: $(curl -s --max-time 20 https://ipinfo.io/country || echo UNKNOWN)"

      - name: Ekonovus — Power BI anonymous query
        run: python3 .github/workflows/probe_ekonovus.py

      - name: Švara — seroval server function
        run: |
          npm install seroval --no-save --silent
          node .github/workflows/probe_svara.mjs

      # Compare only the app's own Žalgirio g. 8A witness containers. A changed
      # horizon raises a warning for manual review; it never starts a bulk fetch.
      - name: Shipped dates still match the operators
        run: |
          set +e
          python3 tools/precheck.py
          code=$?
          set -e
          case "$code" in
            0)  echo "unchanged" ;;
            10) echo "::warning::Žalgirio g. 8A has newer operator dates. Review and publish manually if needed." ;;
            *)  echo "::error::The pre-check could not reach an operator."; exit 1 ;;
          esac
